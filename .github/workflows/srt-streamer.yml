name: SRT Streamer

on:
  push:
    branches: ["**"]
    paths:
      - "srt-streamer/**"
      - ".github/workflows/srt-streamer.yml"
    tags: ["srt-streamer-v*"]   # path filters are not applied to tag pushes
  pull_request:
    paths:
      - "srt-streamer/**"
      - ".github/workflows/srt-streamer.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: srt-streamer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux self-test (x11grab)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: srt-streamer
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg, the SRT library, Tk and a virtual display
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg libsrt1.5-openssl xvfb python3-tk
      - name: Self-test
        run: xvfb-run -a -s "-screen 0 1600x1000x24" /usr/bin/python3 srt_streamer.py --self-test out/linux-x11grab.json --capture x11grab
      - name: Show report
        if: always()
        run: cat out/*.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selftest-linux
          path: srt-streamer/out/
          if-no-files-found: ignore

  windows:
    name: Windows build + self-test
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      HAS_SIGNING_SECRETS: ${{ secrets.AZURE_CLIENT_ID != '' }}
    defaults:
      run:
        shell: pwsh
        working-directory: srt-streamer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download FFmpeg
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # BtbN GPL builds include libsrt (SRT) and ddagrab (GPU capture). Asset names change with
          # each FFmpeg release, so pick the newest stable win64 GPL zip from the latest release.
          $assets = gh release view latest --repo BtbN/FFmpeg-Builds --json assets --jq '.assets[].name'
          $stable = $assets | Where-Object { $_ -match '^ffmpeg-n(\d+)\.(\d+)\S*-win64-gpl-[\d.]+\.zip$' } |
            Sort-Object { $null = $_ -match '^ffmpeg-n(\d+)\.(\d+)'; [int]$Matches[1] * 1000 + [int]$Matches[2] } |
            Select-Object -Last 1
          $name = if ($stable) { $stable } else { "ffmpeg-master-latest-win64-gpl.zip" }
          Write-Host "Using FFmpeg build: $name"
          gh release download latest --repo BtbN/FFmpeg-Builds --pattern $name --output ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffdl
          $bin = Get-ChildItem ffdl -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          New-Item -ItemType Directory -Force vendor | Out-Null
          Copy-Item $bin.FullName vendor/
          Copy-Item (Join-Path $bin.Directory.Parent.FullName "LICENSE.txt") vendor/FFMPEG-LICENSE.txt
          & vendor/ffmpeg.exe -hide_banner -version | Select-Object -First 1
          if (-not (& vendor/ffmpeg.exe -hide_banner -protocols | Select-String -Pattern '^\s*srt\s*$')) { throw "FFmpeg build has no SRT" }
          if (-not (& vendor/ffmpeg.exe -hide_banner -filters | Select-String -Pattern '\sddagrab\s')) { throw "FFmpeg build has no ddagrab" }
          "$PWD\vendor" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Install the SRT library (MSYS2)
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: mingw-w64-ucrt-x86_64-srt

      - name: Collect libsrt.dll and the DLLs it needs
        shell: msys2 {0}
        run: |
          mkdir -p vendor/srt
          cp /ucrt64/bin/libsrt.dll vendor/srt/
          ldd /ucrt64/bin/libsrt.dll | awk '/\/ucrt64\// {print $3}' | xargs -r -I{} cp {} vendor/srt/
          ls -la vendor/srt

      - name: Self-test from source (GDI capture)
        run: |
          python srt_streamer.py --self-test out/source-gdigrab.json --capture gdigrab
          $code = $LASTEXITCODE
          if (Test-Path out/source-gdigrab.json) { Get-Content out/source-gdigrab.json }
          exit $code

      - name: Self-test from source (GPU capture, ddagrab)
        # Hosted runners have no GPU; Desktop Duplication may or may not work there.
        continue-on-error: true
        run: |
          python srt_streamer.py --self-test out/source-ddagrab.json --capture ddagrab
          $code = $LASTEXITCODE
          if (Test-Path out/source-ddagrab.json) { Get-Content out/source-ddagrab.json }
          exit $code

      - name: Build the app folder (FFmpeg and libsrt bundled)
        # A folder build (exe + _internal) rather than a self-extracting single file: antivirus
        # tools flag it far less often, and it starts faster.
        run: |
          python -m pip install --upgrade pip wheel
          # Compile PyInstaller's launcher (bootloader) here instead of using the prebuilt one that
          # ships on PyPI: antivirus products often flag the prebuilt stub because malware reuses it.
          $env:PYINSTALLER_COMPILE_BOOTLOADER = "1"
          python -m pip install --no-binary pyinstaller "pyinstaller==6.11.1"
          $boot = python -c "import PyInstaller, os; print(os.path.join(os.path.dirname(PyInstaller.__file__), 'bootloader', 'Windows-64bit-intel', 'runw.exe'))"
          Get-Item $boot | Format-List FullName, Length, LastWriteTime
          python -m PyInstaller --noconfirm --clean --onedir --windowed `
            --name "SRT Streamer" `
            --icon assets/icon.ico `
            --version-file packaging/version_info.txt `
            --add-binary "vendor/ffmpeg.exe;." `
            --add-binary "vendor/srt/*;srt" `
            --hidden-import selftest `
            srt_streamer.py
          # Standard download: a single SRT Streamer.exe like 1.3 (which antivirus and Smart App Control
          # accepted), without the SRT stats library.
          python -m PyInstaller --noconfirm --onefile --windowed `
            --name "SRT Streamer" `
            --distpath dist-onefile --workpath build-onefile `
            --icon assets/icon.ico `
            --version-file packaging/version_info.txt `
            --add-binary "vendor/ffmpeg.exe;." `
            --hidden-import selftest `
            srt_streamer.py
          Get-Item "dist/SRT Streamer/SRT Streamer.exe", "dist-onefile/SRT Streamer.exe" | Format-List FullName, Length
          Get-ChildItem "dist/SRT Streamer/_internal" -Filter *.exe -Recurse | Format-Table Name, Length

      # Code signing with Microsoft Trusted Signing, so Smart App Control and SmartScreen accept the
      # app. Skipped until the repository has the AZURE_* secrets and TRUSTED_SIGNING_* variables
      # (see srt-streamer/packaging/SIGNING.md). Signs every exe/dll/pyd that isn't already signed,
      # including the bundled FFmpeg and libsrt, then verifies the signatures.
      - name: Sign the app (Trusted Signing)
        if: ${{ env.HAS_SIGNING_SECRETS == 'true' && vars.TRUSTED_SIGNING_ACCOUNT != '' }}
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          Install-Module -Name TrustedSigning -Force -Scope CurrentUser -Repository PSGallery
          $unsigned = Get-ChildItem "dist/SRT Streamer", "dist-onefile" -Recurse -Include *.exe, *.dll, *.pyd |
            Where-Object { (Get-AuthenticodeSignature $_.FullName).Status -ne 'Valid' }
          Write-Host "Signing $($unsigned.Count) file(s)"
          $list = "$env:RUNNER_TEMP\to-sign.txt"
          $unsigned.FullName | Set-Content -Path $list -Encoding utf8
          Invoke-TrustedSigning `
            -Endpoint "${{ vars.TRUSTED_SIGNING_ENDPOINT }}" `
            -CodeSigningAccountName "${{ vars.TRUSTED_SIGNING_ACCOUNT }}" `
            -CertificateProfileName "${{ vars.TRUSTED_SIGNING_PROFILE }}" `
            -FilesCatalog $list `
            -FileDigest SHA256 -TimestampRfc3161 "http://timestamp.acs.microsoft.com" -TimestampDigest SHA256
          $bad = Get-ChildItem "dist/SRT Streamer", "dist-onefile" -Recurse -Include *.exe, *.dll, *.pyd |
            Where-Object { (Get-AuthenticodeSignature $_.FullName).Status -ne 'Valid' }
          if ($bad) { $bad.FullName; throw "$($bad.Count) file(s) are still unsigned" }
          Get-AuthenticodeSignature "dist/SRT Streamer/SRT Streamer.exe" | Format-List Status, SignerCertificate

      - name: Self-test the built exe (GDI capture)
        run: |
          $report = "$PWD\out\exe-gdigrab.json"
          $p = Start-Process -FilePath "dist\SRT Streamer\SRT Streamer.exe" -ArgumentList "--self-test", $report, "--capture", "gdigrab" -Wait -PassThru
          Get-Content $report
          if ($p.ExitCode -ne 0) { throw "exe self-test failed (exit $($p.ExitCode))" }
          $ff = (Get-Content $report | ConvertFrom-Json).info.ffmpeg
          if ($ff -notmatch '_internal') { throw "exe did not use its bundled FFmpeg: $ff" }
          $r = Get-Content $report | ConvertFrom-Json
          if ($r.info.srt_lib -notmatch '_internal') { throw "exe did not use its bundled libsrt: $($r.info.srt_lib)" }
          if (-not $r.info.srt_stats_mode) { throw "exe streamed without SRT statistics" }

      - name: Self-test the built exe (GPU capture, ddagrab)
        continue-on-error: true
        run: |
          $report = "$PWD\out\exe-ddagrab.json"
          $p = Start-Process -FilePath "dist\SRT Streamer\SRT Streamer.exe" -ArgumentList "--self-test", $report, "--capture", "ddagrab" -Wait -PassThru
          Get-Content $report
          if ($p.ExitCode -ne 0) { throw "exe ddagrab self-test failed (exit $($p.ExitCode))" }

      # The standard download (single exe) leaves out libsrt and its MSYS2 DLLs (unsigned third-party
      # files that Smart App Control may refuse); the app then streams with FFmpeg's own SRT, without
      # link statistics or the SRT link test. The "with-srt-stats" folder download includes them.
      - name: Self-test the standard build (GDI capture)
        run: |
          $report = "$PWD\out\exe-standard-gdigrab.json"
          $p = Start-Process -FilePath "dist-onefile\SRT Streamer.exe" -ArgumentList "--self-test", $report, "--capture", "gdigrab" -Wait -PassThru
          Get-Content $report
          if ($p.ExitCode -ne 0) { throw "standard build self-test failed (exit $($p.ExitCode))" }
          $r = Get-Content $report | ConvertFrom-Json
          if ($r.info.ffmpeg -notmatch '_MEI') { throw "standard build did not use its bundled FFmpeg" }
          if ($r.info.srt_stats_mode) { throw "standard build unexpectedly used the SRT library" }

      - name: Package
        run: |
          New-Item -ItemType Directory -Force "pkg-std/SRT Streamer" | Out-Null
          Copy-Item "dist-onefile/SRT Streamer.exe" "pkg-std/SRT Streamer/"
          foreach ($d in "dist/SRT Streamer", "pkg-std/SRT Streamer") {
            Copy-Item vendor/FFMPEG-LICENSE.txt "$d/"
            Copy-Item packaging/README-windows.txt "$d/README.txt"
          }
          Compress-Archive -Path "pkg-std/SRT Streamer" -DestinationPath SRT-Streamer-Windows-x64.zip -Force
          Compress-Archive -Path "dist/SRT Streamer" -DestinationPath SRT-Streamer-Windows-x64-with-srt-stats.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: SRT-Streamer-Windows-x64
          path: srt-streamer/SRT-Streamer-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: SRT-Streamer-Windows-x64-with-srt-stats
          path: srt-streamer/SRT-Streamer-Windows-x64-with-srt-stats.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selftest-windows
          path: srt-streamer/out/
          if-no-files-found: ignore

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/srt-streamer-v')
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches APP_VERSION
        run: |
          want="${GITHUB_REF_NAME#srt-streamer-v}"
          have=$(sed -n 's/^APP_VERSION = "\(.*\)"/\1/p' srt-streamer/srt_streamer.py)
          echo "tag=$want app=$have"
          test "$want" = "$have"
      - uses: actions/download-artifact@v4
        with:
          name: SRT-Streamer-Windows-x64
      - uses: actions/download-artifact@v4
        with:
          name: SRT-Streamer-Windows-x64-with-srt-stats
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" SRT-Streamer-Windows-x64.zip SRT-Streamer-Windows-x64-with-srt-stats.zip \
            --repo "$GITHUB_REPOSITORY" \
            --title "SRT Streamer ${GITHUB_REF_NAME#srt-streamer-v}" \
            --notes "Windows x64 builds with FFmpeg (SRT + GPU capture) bundled, built and self-tested by GitHub Actions on Windows Server 2022. SRT-Streamer-Windows-x64.zip is the standard download. The with-srt-stats download adds the SRT library for link statistics and the SRT link test; unsigned builds of it may be blocked by Windows Smart App Control."
